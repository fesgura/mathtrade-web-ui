name: Checks

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR / branch cancels the run in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Next's build cache, so the build only recompiles what changed.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Before the type check: Next writes next-env.d.ts (gitignored), which
      # declares the image imports (*.jpg, *.png) the type check needs.
      # `next lint` no longer exists; `next typegen` is what emits that file.
      - name: Generate Next types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # No env vars needed: the app's config is hardcoded in next.config.js.
      - name: Build
        run: npm run build
